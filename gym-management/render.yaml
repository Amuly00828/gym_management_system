services:
  - type: web
    name: gym-management-system
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gym-db
          property: connectionString
      - key: NODE_ENV
        value: production

databases:
  - name: gym-db
    plan: free
    databaseName: gym_management
    user: gym_admin
